version: '3'
services:
  learner-web-app:
    build:
      context: .
      dockerfile: Dockerfile.learner-web-app
      secrets:
        - env
    ports:
      - '3003:3003'
      - '4108:4108'
    env_file:
      - .env
    environment:
      - NODE_ENV=production

secrets:
  env:
    file: ./.env

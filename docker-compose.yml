services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  ollama:
    image: ollama/ollama:latest
    ports: ['11434:11434']
    volumes: [ollama_data:/root/.ollama]
  ollama-init:
    image: ollama/ollama:latest
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 5; OLLAMA_HOST=http://ollama:11434 ollama pull llama3; OLLAMA_HOST=http://ollama:11434 ollama pull mistral"]
  ai-worker:
    build: ./ai-gateway
    depends_on: [redis]
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_ROOT: /data/artifacts
    volumes: [ai_artifacts:/data/artifacts]
  ai-gateway:
    build: ./ai-gateway
    depends_on: [redis, ollama]
    environment:
      OLLAMA_API_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_ROOT: /data/artifacts
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
    ports: ['8000:8000']
    volumes: [ai_artifacts:/data/artifacts]
volumes:
  ollama_data:
  ai_artifacts:

version: '3.8'

services:
  # ----------------------------------------------------
  # Database Service (PostgreSQL)
  # Required for Tenant Config Service & API Gateway
  # ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: shiksha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shiksha_tenant_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Async Message Queue (Redis)
  # Required for Celery/BullMQ Background Task Processing
  # (Ingestion, Transcription, Video Generation)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shiksha_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Local AI Inference Gateway (Ollama)
  # Required for LLM Generation (Llama 3 / Mistral)
  # ----------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: shiksha_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Note: To run models, execute `docker exec -it shiksha_ollama ollama run llama3` after startup.

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local

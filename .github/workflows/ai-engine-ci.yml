name: AI Engine CI

on:
  push:
    branches: ["feat/add-ai-engine", "main", "develop"]
    paths:
      - "services/ai-engine/**"
      - ".github/workflows/ai-engine-ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "services/ai-engine/**"
      - "docs/architecture.md"
      - ".github/workflows/ai-engine-ci.yml"

defaults:
  run:
    working-directory: services/ai-engine

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Lint — ruff (fast Python linter, drop-in flake8 replacement)
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/ai-engine/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check . --output-format=github

      - name: Run ruff formatter check
        run: ruff format --check .

  # ──────────────────────────────────────────────────────────────────────────
  # Test — pytest with coverage
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: "Tests (pytest)"
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: services/ai-engine/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --tb=short \
            --cov=main \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: services/ai-engine/coverage.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Docker build smoke-test
  # ──────────────────────────────────────────────────────────────────────────
  docker:
    name: "Docker build"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/ai-engine
          push: false
          tags: ai-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test health endpoint
        run: |
          docker run --rm -d --name ai-engine-smoke -p 8000:8000 ai-engine:ci
          # Wait up to 30 s for the service to be ready
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Service is healthy"
              break
            fi
            echo "Waiting… ($i/15)"
            sleep 2
          done
          docker stop ai-engine-smoke
